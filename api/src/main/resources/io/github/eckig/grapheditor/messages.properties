# Default (English) strings of the graph editor.
#
# Applications can replace these without touching this file, see
# io.github.eckig.grapheditor.utils.GraphEditorProperties#setResourceBundle(ResourceBundle).
#
# NOTE for translators:
#  - every message is a complete MessageFormat pattern, never assembled from
#    fragments, so the word order can be changed freely
#  - the messages deliberately avoid grammatical agreement with a number
#    ("nodes: 1" instead of "1 node"), because plural rules differ far too much
#    between languages to express them with MessageFormat alone

# Spoken by screen readers to describe what kind of control this is.
graphEditor.accessibleRoleDescription = graph editor canvas

# Spoken by screen readers to describe the current content.
# {0} = number of nodes, {1} = number of connections
graphEditor.accessibleText = nodes: {0,number,integer}, connections: {1,number,integer}

# Used when there is no model at all.
graphEditor.accessibleTextEmpty = empty graph
